10px;padding:10px 14px;z-index:1000;font-size:12px}.foot{font-size:11px;color:#69788a;line-height:1.6}.leaflet-top.leaflet-right{top:8px}.leaflet-control-attribution{display:none!important}.flag-credit{position:absolute;right:9px;bottom:10px;z-index:1050;background:#fffef5ed;padding:5px 9px;border:1px solid #dce1ea;border-radius:7px;font-size:11px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 12px #243c5422}.flag-credit a{color:#284a77}.flag-credit svg{width:23px;height:15px}input[type=range]{accent-color:#1667ba}#fallback{display:none;padding:9px;background:#fff3d9;color:#895a00;border-radius:8px;margin-bottom:10px}@media(max-width:750px){header{padding:0 12px;height:55px}header strong{font-size:17px}header small{display:none}.layout{display:flex;flex-direction:column}aside{max-height:45vh;order:2;border-right:0;border-top:1px solid #ddd}.mapwrap{min-height:55vh;order:1;flex:1}}

<script src="https://unpkg.com/vietflexmap@1.0.2/dist/vietflexmap.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script><script src="./config.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),status=t=>{$('status').textContent=t;};
const ADMIN_R2_PUBLIC_URL=String(window.CLIPMAP_CONFIG?.r2PublicUrl||'');
const ADMIN_R2_OBJECT_PATH=String(window.CLIPMAP_CONFIG?.adminObjectPath||'ranhgioi.geojson');
let map,selected=null,mask=null,outline=null,drawControl=null,currentLayer=null,adminFeatures=[],provinceNames=[],adminReady=false;
const bases={
osm:{url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',att:'© OpenStreetMap contributors'},
sat:{url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',att:'Tiles © Esri, Maxar, Earthstar Geographics'},
vietflex:{url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',att:'© OpenStreetMap contributors'}
};
function init(){
try{
 if(window.Vietflex && typeof Vietflex.vietflexMap==='function'){
 const x=Vietflex.vietflexMap('map',{center:[16.2,107.7],zoom:6,zoomControl:false});
 map=x&&x.map&&x.map.getContainer?x.map:x;
 if(!map||typeof map.addLayer!=='function')throw new Error('Lõi không trả về bản đồ Leaflet tương thích');
 status('Sẵn sàng cắt ảnh vệ tinh.');
 }else throw new Error('Không nạp được Vietflexmap 1.0.2');
}catch(err){
 console.warn('Vietflexmap initialization unavailable:',err);
 map=L.map('map',{center:[16.2,107.7],zoom:6,zoomControl:false});
 status('Sẵn sàng cắt ảnh vệ tinh.');
}
L.control.zoom({position:'topright'}).addTo(map);L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
map.createPane('maskPane');map.getPane('maskPane').style.zIndex=460;map.createPane('linePane');map.getPane('linePane').style.zIndex=470;
if(map.attributionControl)map.attributionControl.remove();setBase('sat');
map.on('click',e=>{if(!selected)status('Chọn “Vẽ vùng” hoặc tải GeoJSON để cắt ảnh.');});
}
function setBase(name){
if(currentLayer)map.removeLayer(currentLayer);if(name==='sat'){const old=[];map.eachLayer(l=>{if(l instanceof L.TileLayer)old.push(l)});old.forEach(l=>map.removeLayer(l));}
if(name==='vietflex'){
 // Preserve base layers installed by Vietflex core when available.
 const exists=[];map.eachLayer(l=>{if(l instanceof L.TileLayer)exists.push(l)});
 if(window.Vietflex&&exists.length){currentLayer=exists[0];status('Đang dùng nền từ Vietflexmap 1.0.2');return}
}
const b=bases[name]||bases.osm;currentLayer=L.tileLayer(b.url,{maxZoom:19,crossOrigin:'anonymous',attribution:b.att}).addTo(map);
}
// Web Mercator tiles always operate on WGS84. Reproject coordinates at the data boundary.
// GeoJSON RFC 7946 is WGS84; projected VN-2000 data is exported as .json with CRS metadata.
function convertCRS(input,src,dst){
 if(src===dst)return input;
 if(!window.proj4)throw Error('Thư viện chuyển đổi tọa độ chưa tải.');
 const f=structuredClone(input);
 function convertCoords(v){if(typeof v[0]==='number'){const p=proj4(src,dst,[v[0],v[1]]);return v.length>2?[...p,...v.slice(2)]:p;}return v.map(convertCoords)}
 function go(x){if(!x)return;if(x.type==='FeatureCollection'){x.features.forEach(go);return}if(x.type==='Feature'){go(x.geometry);return}if(x.type==='GeometryCollection'){x.geometries.forEach(go);return}if(x.coordinates)x.coordinates=convertCoords(x.coordinates)}
 go(f);return f;
}
function flatten(data){
const feats=data.type==='FeatureCollection'?data.features:data.type==='Feature'?[data]:[{type:'Feature',properties:{},geometry:data}];
const arr=[];
for(const f of feats){if(!f||!f.geometry)continue;const g=f.geometry;if(g.type==='Polygon')arr.push(g.coordinates);if(g.type==='MultiPolygon')arr.push(...g.coordinates);}
if(!arr.length)throw Error('Dữ liệu không chứa Polygon hoặc MultiPolygon');
return arr;
}
function select(data,fit=true){
const polys=flatten(data);
let count=0;
for(const p of polys)for(const r of p){if(!Array.isArray(r)||r.length<4)throw Error('Polygon không hợp lệ');for(const xy of r){if(!Array.isArray(xy)||!Number.isFinite(xy[0])||!Number.isFinite(xy[1])||Math.abs(xy[0])>180||Math.abs(xy[1])>90)throw Error('Tọa độ phải ở WGS84 [kinh độ,vĩ độ]');count+=1;if(count>1000000)throw Error('Dữ liệu quá lớn');}}
selected={type:'FeatureCollection',features:polys.map((coordinates,i)=>({type:'Feature',properties:{index:i+1},geometry:{type:'Polygon',coordinates}}))};
render();if(fit)zoom();$('featureinfo').hidden=false;$('featureinfo').textContent=polys.length+' polygon · '+count+' đỉnh';status('Đã nạp '+polys.length+' polygon. Có thể cắt ảnh trực tiếp.');
}
function render(){
if(mask)map.removeLayer(mask);if(outline)map.removeLayer(outline);mask=outline=null;
if(!selected)return;
const opts={color:$('color').value,weight:+$('weight').value,fillOpacity:0,interactive:false,pane:'linePane'};
outline=L.geoJSON(selected,{style:opts}).addTo(map);
if(!$('maskon').checked)return;
const outer=[[85,-180],[85,180],[-85,180],[-85,-180],[85,-180]];
const holes=flatten(selected).map(p=>p[0].map(x=>[x[1],x[0]]));
mask=L.polygon([outer,...holes],{stroke:false,fillColor:'#ffffff',fillOpacity:+$('opacity').value/100,fillRule:'evenodd',interactive:false,pane:'maskPane'}).addTo(map);
}
function zoom(){if(!outline)return status('Chưa chọn ranh giới.');const bounds=outline.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.12),{maxZoom:15});}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);}
function startDraw(){status('Nhấp các đỉnh polygon; nhấp đỉnh đầu để kết thúc.');const drawer=new L.Draw.Polygon(map,{allowIntersection:false,showArea:true,shapeOptions:{color:'#db9a26'}});drawer.enable();}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('Tệp quá 30 MB');select(convertCRS(JSON.parse(await f.text()),$('crsin').value,'EPSG:4326'));}catch(err){status('Lỗi GeoJSON: '+err.message);}e.target.value='';});
$('draw').onclick=startDraw;
// Drawing handler is registered after initialization.
$('clear').onclick=()=>{selected=null;if(mask)map.removeLayer(mask);if(outline)map.removeLayer(outline);mask=outline=null;$('featureinfo').hidden=true;$('featureinfo').textContent='';status('Đã xóa vùng cắt.');};
$('zoom').onclick=zoom;
$('basemap').onchange=e=>setBase(e.target.value);
$('opacity').oninput=e=>{$('opval').textContent=e.target.value+'%';render();};
$('weight').oninput=e=>{$('wtval').textContent=e.target.value+' px';render();};
$('color').oninput=render;$('maskon').onchange=render;
$('geojson').onclick=()=>{if(!selected)return status('Chưa có ranh giới để xuất.');try{
const target=$('crsout').value;
const output=target==='EPSG:4326'?selected:convertCRS(selected,'EPSG:4326',target);
if(target!=='EPSG:4326'){output.crs={type:'name',properties:{name:target}};}
download(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}),target==='EPSG:4326'?'clipmap-boundary.geojson':'clipmap-boundary-vn2000-'+target.split(':')[1]+'.json');
}catch(err){status(err.message)}};
$('png').onclick=async()=>{
status('Đang kết xuất PNG…');
try{
 const m=map.getSize(),c=document.createElement('canvas');c.width=Math.round(m.x*devicePixelRatio);c.height=Math.round(m.y*devicePixelRatio);
 const ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#eef2ef';ctx.fillRect(0,0,m.x,m.y);
 const z=map.getZoom(),origin=map.getPixelOrigin(),tiles=[];
 map.eachLayer(l=>{if(l instanceof L.TileLayer && map.hasLayer(l)){const els=l.getContainer()?.querySelectorAll('img.leaflet-tile')||[];for(const im of els){if(!im.complete||!im.naturalWidth)continue;const point=L.DomUtil.getPosition(im),containerPoint=map.layerPointToContainerPoint(point);tiles.push({im,x:containerPoint.x,y:containerPoint.y,w:im.width||256,h:im.height||256});}}});
 if(!tiles.length)throw Error('Lớp nền chưa tải xong.');
 for(const t of tiles)ctx.drawImage(t.im,t.x,t.y,t.w,t.h);
 if(selected){
  const drawRing=ring=>{ring.forEach((co,i)=>{const p=map.latLngToContainerPoint([co[1],co[0]]);if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)});ctx.closePath();};
  if($('maskon').checked){ctx.beginPath();ctx.rect(0,0,m.x,m.y);for(const p of flatten(selected))drawRing(p[0]);ctx.fillStyle='rgba(255,255,255,'+(+$('opacity').value/100)+')';ctx.fill('evenodd');}
  ctx.beginPath();for(const p of flatten(selected))for(const ring of p)drawRing(ring);
  ctx.strokeStyle=$('color').value;ctx.lineWidth=+$('weight').value;ctx.stroke();
 }
 ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(0,m.y-28,m.x,28);ctx.fillStyle='#263a50';ctx.font='11px system-ui';ctx.fillText('ClipMap · © 2026 Long Ngo · Nền: '+($('basemap').selectedOptions[0].textContent)+' · Bản đồ tham khảo',9,m.y-9);
 await new Promise((res,rej)=>c.toBlob(b=>b? (download(b,'clipmap-satellite.png'),res()):rej(Error('Không thể xuất canvas; tile nền có thể bị chặn CORS')),'image/png'));
 status('Đã tạo PNG.');
}catch(err){status('Không thể xuất PNG: '+err.message+'. Hãy thử lớp nền có CORS hoặc dùng chụp màn hình.');}
};
function getProp(f,keys){const p=f.properties||{};for(const k of keys){const v=p[k];if(v!=null&&String(v).trim())return String(v).trim()}return ''}
const provinceKeys=['ten_tinh','Ten_Tinh','TEN_TINH','tinh','province','province_name','NAME_1','TENTINH','tenTinh','name','Name','NAME','TEN','ten'];
let provinceFeatures=[],wardsIndex=[],provinceIndex=[],shardCache=new Map(),provinceByName=new Map(),selectedWardId='',shardLoading=null;
function uniqueSorted(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))}
function populateSelect(id,entries,placeholder){const el=$(id);el.replaceChildren(new Option(placeholder,''));for(const e of entries)el.add(new Option(e.name,e.id));el.disabled=!entries.length}
const host=ADMIN_R2_PUBLIC_URL.endsWith('/')?ADMIN_R2_PUBLIC_URL.slice(0,-1):ADMIN_R2_PUBLIC_URL;
async function getObject(path){const url=host+'/'+path.split('/').map(encodeURIComponent).join('/');const res=await fetch(url,{mode:'cors'});if(!res.ok)throw Error('HTTP '+res.status+' · '+path);return res.json()}
function collection(x){if(!x||x.type!=='FeatureCollection')throw Error('GeoJSON không hợp lệ');return x.features.filter(f=>f?.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type))}
async function loadAdmin(){
try{
$('adminload').textContent='Đang tải chỉ mục hành chính…';
let idx=null, indexPath='';
for(const candidate of [window.CLIPMAP_CONFIG.indexObjectPath||'index.json','provinces/index.json']){
 try{idx=await getObject(candidate);indexPath=candidate;break;}catch(e){if(!String(e.message).includes('HTTP 404'))throw e;}
}
if(!idx)throw Error('Không thấy index.json tại gốc bucket hoặc provinces/. Hãy tải index.json lên gốc R2.');
if(idx.schema!=='clipmap-r2-index-v1'||!Array.isArray(idx.provinces)||!Array.isArray(idx.wards))throw Error('Sai cấu trúc index.json');
if(!idx.provinces.length||!idx.wards.length)throw Error('index.json không có dữ liệu');
const codes=new Set(idx.provinces.map(p=>String(p.id)));
if(idx.wards.some(w=>!codes.has(String(w.provinceId))))throw Error('Mã tỉnh trong index không khớp');
provinceIndex=idx.provinces;wardsIndex=idx.wards;provinceByName=new Map(idx.provinces.map(p=>[p.name,p]));adminReady=true;
populateSelect('province',provinceIndex,'Chọn tỉnh/thành');
populateSelect('commune',[],'Chọn tỉnh trước');
$('adminload').textContent='Đã lập chỉ mục '+provinceIndex.length+' tỉnh/thành · '+wardsIndex.length+' xã/phường'+(indexPath==='provinces/index.json'?' · cần chuyển index.json lên thư mục gốc':'');
status('Đã tải chỉ mục, chưa cần tải các polygon.');
}catch(err){
adminReady=false;
$('adminload').textContent='Chưa có chỉ mục mới trên R2';
status('Cần tải index.json và 34 tệp vào R2: '+err.message);
}
}
function resetCommune(){
const pid=$('province').value;
const filtered=wardsIndex.filter(w=>String(w.provinceId)===pid);
populateSelect('commune',filtered,'Toàn bộ tỉnh/thành');
$('clipadmin').disabled=!pid;
status(pid?'Có '+filtered.length+' xã/phường. Chỉ tải polygon khi bấm Cắt.':'Chọn tỉnh/thành.');
}
$('province').onchange=resetCommune;
async function getShard(pid){
if(shardCache.has(pid))return shardCache.get(pid);
const p=provinceIndex.find(p=>String(p.id)===pid);
if(!p)throw Error('Không tìm thấy tỉnh');
if(!p.path||!/^provinces\/[A-Za-z0-9_-]+\.geojson$/.test(p.path))throw Error('Đường dẫn shard không hợp lệ');
if(shardLoading&&shardLoading.pid!==pid)shardLoading.controller.abort();
const controller=new AbortController();
shardLoading={pid,controller};
const url=host+'/'+p.path.split('/').map(encodeURIComponent).join('/');
const res=await fetch(url,{signal:controller.signal,mode:'cors'});
if(!res.ok)throw Error('HTTP '+res.status+' · '+p.path);
const geo=await res.json(),features=collection(geo);
shardCache.set(pid,features);
if(shardCache.size>3)shardCache.delete(shardCache.keys().next().value);
return features;
}
$('clipadmin').onclick=async()=>{
if(!adminReady)return status('Cần tải index.json lên R2.');
const pid=$('province').value,wid=$('commune').value;if(!pid)return status('Chọn tỉnh/thành.');
try{
$('clipadmin').disabled=true;status('Đang tải hình học của tỉnh đã chọn…');
const fs=await getShard(pid);
const p=provinceIndex.find(p=>String(p.id)===pid);
let selectedFeatures=wid?fs.filter(f=>{
